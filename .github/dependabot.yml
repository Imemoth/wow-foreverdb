version: 2

# Branch strategy: main is the default integration branch for both Dependabot
# version and SECURITY update PRs. Changes reach release only via reviewed
# release-candidate/hotfix PRs. Do not add target-branch: release: security
# updates always target the repository default branch (main).
#
# Keep routine maintenance reviewable. Dependabot security updates are not
# restricted by the version-update allow rules or the PR limits below.
# Major upgrades require a dedicated compatibility/test plan rather than
# automatic version-update pull requests.
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      web-nonmajor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /publisher
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      publisher-nonmajor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      actions-nonmajor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
