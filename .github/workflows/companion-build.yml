name: Build ForeverDB Companion

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore companion/ForeverDB.Companion/ForeverDB.Companion.csproj

      - name: Publish x64
        run: >
          dotnet publish companion/ForeverDB.Companion/ForeverDB.Companion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/ForeverDB-Companion-win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForeverDB-Companion-win-x64
          path: artifacts/ForeverDB-Companion-win-x64
