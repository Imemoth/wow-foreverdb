name: Map atlas pipeline

# Stable check name: "Map atlas pipeline tests". Like the other workflows there is deliberately NO `paths:` filter.
# Runs only synthetic fixtures (real BLP2/DXT tiles + DB2-shaped CSVs generated in the test). No WoW client, no network,
# no Cloudflare, and no real map artwork other than the already committed POC asset used for the immutable-v1 checks.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Map atlas pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r scripts/map-atlas/requirements.txt

      - name: Unit and end-to-end tests (synthetic client)
        working-directory: scripts/map-atlas
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
