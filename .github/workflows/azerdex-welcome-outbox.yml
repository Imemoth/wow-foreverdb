name: AzerDex welcome outbox (SQL + real GoTrue + worker)

# Migration 0015 + worker. Disposable PostgreSQL and a real GoTrue built from the pinned upstream release tag (same pin as the Account
# suites); Resend is mocked. Nothing here touches a real Supabase or Resend account. Like the other account workflows there is
# deliberately NO `paths:` filter so the check always reports.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutation_check:
        description: 'Also run the migration mutation check (slow)'
        required: false
        type: boolean
        default: false

concurrency:
  group: azerdex-welcome-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  welcome-outbox:
    name: AzerDex welcome outbox SQL + real GoTrue + worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-test-password
      FDB_REQUIRE_GOTRUE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Disposable PostgreSQL 16
        run: |
          docker run -d --name fdb-pg -p 5432:5432 -e POSTGRES_PASSWORD=local-test-password postgres:16 \
            -c track_commit_timestamp=on -c max_connections=300
          for i in $(seq 1 60); do pg_isready -h 127.0.0.1 -U postgres && break || sleep 1; done
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Install web dependencies (pg driver used by the suites)
        working-directory: web
        run: npm ci
      - uses: denoland/setup-deno@v2
        with: { deno-version: '2.9.6' }   # real Deno runtime for the entry-point / bundle-layout tests
      - name: Worker unit tests, emblem asset and Deno entry-point/bundle regression (mocked Resend and database)
        run: node --test tests/welcome-worker/*.test.mjs
        env:
          FDB_REQUIRE_DENO: '1'
      - name: Build real GoTrue (pinned upstream release tag)
        run: database/tests/account/build-gotrue.sh
      - name: Stack up (migrations through 0012, then 0014, then 0015; GoTrue mail to the in-process sink)
        run: database/tests/welcome/stack.sh up
      - name: Re-apply 0015 (idempotent body)
        run: PGOPTIONS="-c client_min_messages=warning" PGPASSWORD=local-test-password psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U fdb_migrator -d fdb_account_it -f database/migrations/0015_azerdex_welcome_outbox.sql
      - name: Privileges, provenance (real GoTrue), worker RPCs, worker end-to-end
        run: node --test --test-concurrency=1 database/tests/welcome/*.test.mjs
      - name: Mutation check (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mutation_check }}
        run: node database/tests/welcome/mutation_check.mjs
      # The welcome suites above already ran on 0012 -> 0014 -> 0015 (the order of a real project). This step covers the OTHER order:
      # 0015 present first, 0014 (zero-touch enrollment, merged to main) applied afterwards, so neither migration depends on the other's position.
      - name: Compatibility - existing Account suite with 0015 applied (exercises the exact-signature exclusion in 01_privileges.test.mjs)
        run: |
          database/tests/account/stack.sh up
          database/tests/account/stack.sh apply
          PGOPTIONS="-c client_min_messages=warning" PGPASSWORD=local-test-password psql -X -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U fdb_migrator -d fdb_account_it -f database/migrations/0015_azerdex_welcome_outbox.sql
          node --test --test-concurrency=1 database/tests/account/*.test.mjs
      # 04_concurrency.test.mjs is EXCLUDED here on purpose: its "ticket revocation racing redemption" test runs 30 rounds on ONE account and fails
      # intermittently on main itself (measured 2 of 3 fresh runs WITHOUT 0015) once enough rounds enrol and the account hits its device limit
      # ("device_limit" instead of "enrolled"/"ticket_revoked"). It is unrelated to 0015 (which touches no enrollment table) and is tracked separately.
      - name: Compatibility - 0014 applied AFTER 0015, then the enrollment suite (all files except the known-flaky 04_concurrency) with the welcome objects present
        run: |
          database/tests/account/stack.sh apply14
          node --test --test-concurrency=1 $(ls database/tests/enrollment/*.test.mjs | grep -v '/04_concurrency\.test\.mjs$')
      - name: GoTrue log (on failure)
        if: failure()
        run: tail -n 200 database/tests/account/.run/gotrue.log || true
