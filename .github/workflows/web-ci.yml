name: ForeverDB Web & publication pipeline

# Required-check design (see docs/web/release-gates.md):
#   * No `paths:` filter. A path-filtered workflow never reports on unrelated PRs, and a required
#     check that never reports blocks the PR forever (or is silently skipped). Every PR reports every check.
#   * Distinct, stable check names. Do NOT rename a job without updating the repository ruleset.
#   * `Web release gate` aggregates the others and fails if any of them failed, was cancelled or skipped.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------------------------
  web-quality:
    name: Web code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Node.js major matches the pinned version (.node-version = package.json engines = Vercel)
        run: |
          pinned="$(tr -d '[:space:]' < ../.node-version)"
          actual="$(node -p "process.versions.node.split('.')[0]")"
          engines="$(node -p "require('./package.json').engines.node")"
          echo "pinned=$pinned actual=$actual engines=$engines"
          test "$actual" = "$pinned" && test "$engines" = "$pinned.x"
      - run: npm ci
      - name: Production dependency audit (high and critical fail)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Environment-boundary matrix (local / preview / production, negative configurations)
        run: npx vitest run tests/unit/env.test.ts tests/unit/env-matrix.test.ts
      - name: Production build (canary secrets present in the build environment)
        env:
          PUBLIC_READ_DATABASE_URL: postgresql://foreverdb_web_reader:CANARY-db-secret-value@canary.invalid/x
          UPSTASH_REDIS_REST_TOKEN: CANARY-upstash-token-value-123
          RATE_LIMIT_SALT: CANARY-salt-value-0123456789abcdef0123456789
        run: npm run build
      - name: Bundle-secret scan (no canaries, DB URLs, private project reference or source maps in browser bundles)
        env:
          PUBLIC_READ_DATABASE_URL: postgresql://foreverdb_web_reader:CANARY-db-secret-value@canary.invalid/x
          UPSTASH_REDIS_REST_TOKEN: CANARY-upstash-token-value-123
          RATE_LIMIT_SALT: CANARY-salt-value-0123456789abcdef0123456789
        run: npm run check:bundle-secrets

  # ---------------------------------------------------------------------------------------------
  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Search and navigation journeys
        run: npx playwright test --project=desktop tests/e2e/journeys.spec.ts
      - name: Security headers, CSP, API validation and rate limiting
        run: npx playwright test --project=desktop tests/e2e/security.spec.ts
      - name: Preview safety (synthetic banner, noindex, robots, sitemap, headers, cookies, fail-closed configurations)
        run: npx playwright test --project=preview
      - name: Accessibility regression (axe WCAG 2.2 AA) and SEO
        run: npx playwright test --project=desktop tests/e2e/a11y-seo.spec.ts
      - name: Responsive layout (desktop and mobile)
        run: npx playwright test --project=desktop --project=mobile tests/e2e/responsive.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-e2e-results, path: web/test-results, retention-days: 14 }

  # ---------------------------------------------------------------------------------------------
  publisher-and-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-test-password
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - name: Publisher unit tests
        working-directory: publisher
        run: npm ci && npm run typecheck && npm test
      - name: End-to-end publication pipeline on ephemeral PostgreSQL
        run: ./scripts/public-pipeline-integration.sh
      - name: Website against the published public read model (Postgres adapter)
        working-directory: web
        env:
          FOREVERDB_DATA_SOURCE: postgres
          PUBLIC_READ_DATABASE_URL: postgresql://foreverdb_web_reader:it-only@localhost:5432/fdb_it_public
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop tests/e2e/journeys.spec.ts tests/e2e/security.spec.ts
      - name: Fixture <-> PostgreSQL adapter parity (zone semantics regression dataset)
        working-directory: web
        env:
          PARITY_DATABASE_URL: postgresql://foreverdb_web_reader:it-only@localhost:5432/fdb_it_zone
        run: npm run test:parity

  # ---------------------------------------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------------------------
  web-gate:
    name: Web release gate
    if: always()
    needs: [web-quality, web-e2e, publisher-and-pipeline, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Every upstream job must have succeeded (failed, cancelled and skipped all fail the gate)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
