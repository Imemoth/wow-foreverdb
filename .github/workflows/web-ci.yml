name: ForeverDB Web & publication pipeline

# Required-check design (see docs/web/release-gates.md):
#   * No `paths:` filter. A path-filtered workflow never reports on unrelated PRs, and a required
#     check that never reports blocks the PR forever (or is silently skipped). Every PR reports every check.
#   * Distinct, stable check names. Do NOT rename a job without updating the repository ruleset.
#   * `Web release gate` aggregates the others and fails if any of them failed, was cancelled or skipped.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ---------------------------------------------------------------------------------------------
  web-quality:
    name: Web code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Node.js major matches the pinned version (.node-version = engines of web and publisher; Vercel reads engines)
        run: |
          pinned="$(tr -d '[:space:]' < ../.node-version)"
          actual="$(node -p "process.versions.node.split('.')[0]")"
          web="$(node -p "require('./package.json').engines.node")"
          pub="$(node -p "require('../publisher/package.json').engines.node")"
          echo "pinned=$pinned actual=$actual web.engines=$web publisher.engines=$pub"
          test "$actual" = "$pinned" && test "$web" = "$pinned.x" && test "$pub" = "$pinned.x"
      - run: npm ci
      - name: Production dependency audit (high and critical fail)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Environment-boundary matrix (local / preview / production, negative configurations)
        run: npx vitest run tests/unit/env.test.ts tests/unit/env-matrix.test.ts
      - name: Production build (canary secrets present in the build environment)
        env:
          AZERDEX_READ_DB_URL: postgresql://foreverdb_web_reader:CANARY-db-secret-value@canary.invalid/x
          UPSTASH_REDIS_REST_TOKEN: CANARY-upstash-token-value-123
          RATE_LIMIT_SALT: CANARY-salt-value-0123456789abcdef0123456789
        run: npm run build
      - name: Bundle-secret scan (no canaries, DB URLs, private project reference or source maps in browser bundles)
        env:
          AZERDEX_READ_DB_URL: postgresql://foreverdb_web_reader:CANARY-db-secret-value@canary.invalid/x
          UPSTASH_REDIS_REST_TOKEN: CANARY-upstash-token-value-123
          RATE_LIMIT_SALT: CANARY-salt-value-0123456789abcdef0123456789
        run: npm run check:bundle-secrets

  # ---------------------------------------------------------------------------------------------
  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Search and navigation journeys
        run: npx playwright test --project=desktop tests/e2e/journeys.spec.ts
      - name: Security headers, CSP, API validation and rate limiting
        run: npx playwright test --project=desktop tests/e2e/security.spec.ts
      - name: Preview safety (synthetic banner, noindex, robots, sitemap, headers, cookies, fail-closed configurations)
        run: npx playwright test --project=preview
      - name: Accessibility regression (axe WCAG 2.2 AA) and SEO
        run: npx playwright test --project=desktop tests/e2e/a11y-seo.spec.ts
      - name: Class guides and talent calculator (desktop and mobile)
        run: npx playwright test --project=desktop --project=mobile tests/e2e/talents.spec.ts
      - name: Responsive layout (desktop and mobile)
        run: npx playwright test --project=desktop --project=mobile tests/e2e/responsive.spec.ts
      # Zone atlas maps (feature-gated, off by default): needs a second build WITH the CDN origin baked in. Runs against a real local HTTPS
      # server standing in for the CDN host (synthetic atlas generated from the bundled catalog snapshot): wiring, scaling, CSP and CORS
      # are enforced by the real browser; no private artwork and no network access to the real CDN are involved.
      - name: Zone atlas maps (desktop and mobile, synthetic CDN)
        env:
          NEXT_PUBLIC_AZERDEX_ASSET_BASE_URL: https://azerdex-assets.pages.dev
        run: |
          npm run build
          npx playwright test -c playwright.zone-maps.config.ts
      # Same build, cinematic heroes served from the CDN host's zone-heroes/ namespace (AZERDEX_ZONE_HERO_SOURCE=cdn, default is same-origin).
      # The stand-in CDN serves the public watermarked derivatives with the headers of the unified _headers; checks headers, 404s, CSP, CORS, timing.
      - name: Zone atlas maps with CDN-served cinematic heroes (desktop and mobile, synthetic CDN)
        env:
          NEXT_PUBLIC_AZERDEX_ASSET_BASE_URL: https://azerdex-assets.pages.dev
          E2E_HERO_SOURCE: cdn
        run: npx playwright test -c playwright.zone-maps.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-e2e-results, path: web/test-results, retention-days: 14 }

  # ---------------------------------------------------------------------------------------------
  publisher-and-pipeline:
    name: publisher-and-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-test-password
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - name: Publisher unit tests
        working-directory: publisher
        run: npm ci && npm run typecheck && npm test
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.1.4 }  # the Supabase Edge runtime's Deno-compatible version
      # Must run BEFORE `deno check`: a non-frozen check silently rewrites an out-of-date lock inside the runner and would hide drift.
      # `deno cache --frozen`, not `deno check --frozen`: Deno < 2.6 type-checking injects an implicit @types/node that it never
      # writes to the lock, so `check --frozen` fails on this pinned Deno whatever lock is committed (docs/web/release-gates.md §6).
      - name: Supabase Edge Function lockfile is frozen-consistent (deno.json <-> deno.lock, integrity hashes)
        working-directory: supabase/functions/publish-observations
        run: deno cache --frozen index.ts
      - name: Supabase Edge Function type-check (the function is a thin adapter over publisher/src/core)
        run: |
          node scripts/sync-edge-core.mjs --check
          cd supabase/functions/publish-observations && deno check index.ts
      - name: Public-read migrations 0001-0005 applied as a NON-superuser admin (hosted-like), publication, ops and security SQL tests
        run: ./scripts/public-hosted-compat.sh
      - name: Failure, recovery, idempotency and concurrency of the publication pipeline (isolated, hosted-like database)
        run: ./scripts/public-failure-recovery-tests.sh
      - name: End-to-end publication pipeline on ephemeral PostgreSQL
        run: ./scripts/public-pipeline-integration.sh
      - name: Website against the published public read model (Postgres adapter)
        working-directory: web
        env:
          FOREVERDB_DATA_SOURCE: postgres
          AZERDEX_READ_DB_URL: postgresql://foreverdb_web_reader:it-only@localhost:5432/fdb_it_public
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop tests/e2e/journeys.spec.ts tests/e2e/security.spec.ts
      - name: Public-beta SEO against a published read model (genuine active publication, real HTTP, beta.azerdex.com Host)
        working-directory: web
        env:
          BETA_SEO_DATABASE_URL: postgresql://foreverdb_web_reader:it-only@localhost:5432/fdb_it_public
        run: npx playwright test --project=desktop tests/e2e/beta-seo.spec.ts
      - name: Fixture <-> PostgreSQL adapter parity (zone semantics regression dataset)
        working-directory: web
        env:
          PARITY_DATABASE_URL: postgresql://foreverdb_web_reader:it-only@localhost:5432/fdb_it_zone
        run: npm run test:parity

  # ---------------------------------------------------------------------------------------------
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------------------------------------
  # Both npm roots. publisher/ was never audited before, so an advisory in its production dependencies (zod, GHSA-mrhx-c7xc-m3w5)
  # was invisible to CI. Joins the aggregate gate below, so the required `Web release gate` fails with it (no ruleset change).
  #   production tree: high and critical fail, independent of the dev-dependency policy
  #   full tree (incl. devDependencies): moderate and above fail
  # `npm ci --ignore-scripts`: audit only reads the resolved tree, so no package lifecycle script needs to run. Investigation: release-gates.md §5.
  dependency-audit:
    name: Dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: { project: [web, publisher] }
    defaults: { run: { working-directory: '${{ matrix.project }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: '${{ matrix.project }}/package-lock.json' }
      - run: npm ci --ignore-scripts
      - name: Production dependency audit (high and critical fail)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit incl. devDependencies (moderate and above fail)
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=moderate
      - name: Audit findings in the job summary (advisory ids, severity, dependency path)
        if: failure()
        run: |
          {
            echo '### npm audit findings in `${{ matrix.project }}/`'
            echo '```'
            npm audit || true
            echo '```'
            echo 'How to investigate and fix: docs/web/release-gates.md section 5.'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --json > "$RUNNER_TEMP/npm-audit-${{ matrix.project }}.json" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'npm-audit-${{ matrix.project }}', path: '${{ runner.temp }}/npm-audit-${{ matrix.project }}.json', retention-days: 14 }

  # ---------------------------------------------------------------------------------------------
  web-gate:
    name: Web release gate
    if: always()
    needs: [web-quality, web-e2e, publisher-and-pipeline, codeql, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every upstream job must have succeeded (failed, cancelled and skipped all fail the gate)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
