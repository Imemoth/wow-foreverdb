name: Companion health checks

on:
  push:
    branches:
      - companion/sync-health-status
    paths:
      - 'companion/**'
      - 'tests/companion-health/**'
      - 'tests/companion-guildbook/**'
      - 'docs/0.8-guildbook-acceptance.md'
      - '.github/workflows/companion-health.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'tests/companion-health/**'
      - 'tests/companion-guildbook/**'
      - 'docs/0.8-guildbook-acceptance.md'
      - '.github/workflows/companion-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Companion
        run: dotnet build companion/ForeverDB.Companion/ForeverDB.Companion.csproj -c Release

      - name: Sync health regression checks
        run: dotnet run --project tests/companion-health/Companion.Health.Tests.csproj -c Release

      - name: Guildbook filter regression checks
        run: dotnet run --project tests/companion-guildbook/Companion.Guildbook.Tests.csproj -c Release

      - name: git diff --check
        shell: pwsh
        run: |
          $base = git merge-base origin/main HEAD
          git diff --check $base HEAD
