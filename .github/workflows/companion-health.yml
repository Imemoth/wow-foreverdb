name: Companion health checks

on:
  push:
    branches:
      - companion/sync-health-status
    paths:
      - 'companion/**'
      - 'tests/companion-health/**'
      - 'tests/companion-guildbook/**'
      - 'tests/companion-search-zone/**'
      - 'tests/companion-map-reveal/**'
      - 'database/migrations/**'
      - 'docs/0.8-guildbook-acceptance.md'
      - '.github/workflows/companion-health.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'tests/companion-health/**'
      - 'tests/companion-guildbook/**'
      - 'tests/companion-search-zone/**'
      - 'tests/companion-map-reveal/**'
      - 'database/migrations/**'
      - 'docs/0.8-guildbook-acceptance.md'
      - '.github/workflows/companion-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Companion
        run: dotnet build companion/ForeverDB.Companion/ForeverDB.Companion.csproj -c Release

      - name: Sync health regression checks
        run: dotnet run --project tests/companion-health/Companion.Health.Tests.csproj -c Release

      - name: Guildbook filter regression checks
        run: dotnet run --project tests/companion-guildbook/Companion.Guildbook.Tests.csproj -c Release

      - name: Search zone regression checks
        run: dotnet run --project tests/companion-search-zone/Companion.SearchZone.Tests.csproj -c Release

      - name: Fully revealed map art regression checks
        run: dotnet run --project tests/companion-map-reveal/Companion.MapReveal.Tests.csproj -c Release

      - name: Current Forever DB2 metadata transport probe (informational)
        if: github.event_name == 'pull_request' && github.head_ref == 'research/full-reveal-map-art-gate'
        continue-on-error: true
        run: dotnet run --project tests/companion-map-reveal/Companion.MapReveal.Tests.csproj -c Release -- --probe-current-forever

      - name: git diff --check
        shell: pwsh
        run: |
          $base = git merge-base origin/main HEAD
          git diff --check $base HEAD
