name: Account end-to-end integration (GoTrue + PostgREST)

# Account System V1, PR E acceptance: the website's linking flow, private Guildbook and the Companion-style anonymous/registered clients
# against a REAL, EPHEMERAL stack:  PostgreSQL 16  +  real GoTrue (pinned supabase/auth tag AND commit)  +  real PostgREST (pinned release,
# checksum-verified)  +  Mailpit (captured mail), with the repository migrations 0001-0006, 0008, 0009, 0011, 0012 and 0018 applied (0007 is skipped exactly as in the SQL suite; 0010 and 0013 are never applied) exactly as the SQL suite does.
# PostgREST and GoTrue are the real programs (the SQL suite emulates PostgREST; this one does not); only the API gateway (Kong) is a small pass-through shim. Nothing real is touched: no Supabase project, no production
# credential, no Vercel. If any component cannot start the job FAILS (integrated acceptance BLOCKED); it never falls back to stubs.
#
# Like web-ci.yml and the other account workflows there is deliberately NO `paths:` filter, so the check reports on every pull request and
# every push to main and can never leave a required status check pending.
#
# Stable job/check name:  "Account end-to-end (GoTrue + PostgREST)"
# OWNER ACTION (not done by this PR): after it has reported consistently, add that exact check name (GitHub Actions app, integration id 15368)
# to ruleset 24853899 next to the existing nine and verify the readback shows ten unique checks.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  GOTRUE_TAG: v2.197.0                # same upstream release as the web-auth and SQL suites (build-gotrue.sh also pins the commit)
  POSTGREST_TAG: v12.2.12             # reviewed PostgREST release; compare with the hosted staging version (owner evidence)
  POSTGREST_SHA256: 5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5   # linux-static-x86-64 archive of POSTGREST_TAG
  MAILPIT_TAG: v1.31.5

jobs:
  account-e2e:
    name: Account end-to-end (GoTrue + PostgREST)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: local-test-password
      STACK_BIN: ${{ github.workspace }}/.stack-bin
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Node.js is the pinned major (24)
        run: test "$(node -p "process.versions.node.split('.')[0]")" = "$(tr -d '[:space:]' < ../.node-version)"
      - uses: actions/setup-go@v5
        with: { go-version: '1.24', cache: false }   # upstream needs a newer toolchain; GOTOOLCHAIN=auto fetches it

      - name: Disposable PostgreSQL 16 (database only; GoTrue, PostgREST and migrations run against it)
        working-directory: ${{ github.workspace }}
        run: |
          docker run -d --name fdb-pg -p 5432:5432 -e POSTGRES_PASSWORD=local-test-password postgres:16 \
            -c track_commit_timestamp=on -c max_connections=300
          for i in $(seq 1 60); do pg_isready -h 127.0.0.1 -U postgres && break || sleep 1; done
          pg_isready -h 127.0.0.1 -U postgres

      - name: Restore stack binaries (GoTrue, PostgREST, Mailpit)
        id: bin
        uses: actions/cache@v4
        with:
          path: .stack-bin
          key: e2e-stack-bin-${{ env.GOTRUE_TAG }}-${{ hashFiles('database/tests/account/build-gotrue.sh') }}-${{ env.POSTGREST_TAG }}-${{ env.POSTGREST_SHA256 }}-${{ env.MAILPIT_TAG }}-v1
      - name: Build GoTrue (commit-pinned), download PostgREST (checksum-pinned), build Mailpit
        if: steps.bin.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p .stack-bin
          database/tests/account/build-gotrue.sh "$GITHUB_WORKSPACE/.stack-bin/gotrue"
          curl -fsSL -o /tmp/postgrest.tar.xz "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_TAG}/postgrest-${POSTGREST_TAG}-linux-static-x86-64.tar.xz"
          echo "${POSTGREST_SHA256}  /tmp/postgrest.tar.xz" | sha256sum -c -
          tar -xJf /tmp/postgrest.tar.xz -C .stack-bin postgrest
          GOBIN="$GITHUB_WORKSPACE/.stack-bin" go install "github.com/axllent/mailpit@${MAILPIT_TAG}"
      - run: npm ci

      - name: Unit, static and migration-conformance tests (every account module, the closed clients, the edge rules, LS-10 tripwire)
        run: npx vitest run
      - name: Typecheck and lint
        run: npx tsc --noEmit && npx eslint .

      - name: Start the end-to-end stack (real GoTrue + real PostgREST + migrations 0001-0012 + Mailpit); the PostgREST schema-cache reload after 0012 is observed
        env:
          GOTRUE_BIN: ${{ env.STACK_BIN }}/gotrue
          POSTGREST_BIN: ${{ env.STACK_BIN }}/postgrest
          MAILPIT_BIN: ${{ env.STACK_BIN }}/mailpit
          STACK_DIR: ${{ github.workspace }}/.stack
        run: ./tests/e2e-stack/up.sh
      - name: Record exactly what is under test
        run: |
          {
            echo "### Integrated stack"
            echo '```json'; cat "$GITHUB_WORKSPACE/.stack/versions.json"; echo; cat "$GITHUB_WORKSPACE/.stack/schema-cache.json"; echo; echo '```'
            echo "- hosted Supabase staging must be compared against these versions (owner evidence): GoTrue source commit, PostgREST release, \`db-tx-end = commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Production build with account configuration and canary secrets, then the bundle-secret scan
        env:
          FOREVERDB_DEPLOYMENT: local
          ACCOUNT_AUTH_MODE: local
          ACCOUNT_CSRF_SECRET: CANARY-csrf-secret-0123456789abcdefghijklmnopqrstuvwxyz
          AZERDEX_READ_DB_URL: postgresql://foreverdb_web_reader:CANARY-db-secret-value@canary.invalid/x
          UPSTASH_REDIS_REST_TOKEN: CANARY-upstash-token-value-123
          RATE_LIMIT_SALT: CANARY-salt-value-0123456789abcdef0123456789
        run: |
          set -a; . "$GITHUB_WORKSPACE/.stack/env"; set +a
          export ACCOUNT_AUTH_URL="$ACCOUNT_STACK_URL" ACCOUNT_AUTH_PUBLISHABLE_KEY="$ACCOUNT_STACK_ANON_KEY"
          npm run build
          npm run check:bundle-secrets
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integrated acceptance (redemption with fresh password, pre-hijack, two accounts + anonymous owner, private Guildbook, real PostgREST semantics, replay/concurrency/preservation, fault injection, CSRF/XSS/redirects, browser UI + accessibility)
        env:
          E2E_STACK_ENV_FILE: ${{ github.workspace }}/.stack/env
        run: npx playwright test -c playwright.account-e2e.config.ts
      - name: Summarise
        if: always()
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("test-results/account-e2e-results.json","utf8"));
            let t=0,p=0,f=0,s=0;
            (function w(x){ for (const sp of x.specs??[]) for (const tt of sp.tests) { t++; const st = tt.results.at(-1)?.status; if (st==="passed") p++; else if (st==="skipped") s++; else f++; } for (const c of x.suites??[]) w(c); })({suites:r.suites});
            console.log(`### Integrated acceptance (real GoTrue + real PostgREST)\n- ${t} tests: ${p} passed, ${f} failed, ${s} skipped`);
          ' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload traces, results and stack logs (test data only; no secret exists in this stack)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-e2e-evidence
          path: |
            web/test-results/
            .stack/*.log
            .stack/*.json
            .stack/run/gotrue.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the stack
        if: always()
        env:
          STACK_DIR: ${{ github.workspace }}/.stack
        run: ./tests/e2e-stack/down.sh
