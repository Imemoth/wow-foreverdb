name: AzerDex Ops Bot

# NOT a required check, by design (docs/web/release-gates.md: a path-filtered workflow never reports on unrelated PRs, and a
# required check that never reports blocks them). It runs whenever the bot or its docs change, and on demand. Adding it to the
# `release` ruleset would be a separate owner decision.
on:
  pull_request:
    paths:
      - 'ops-bot/**'
      - 'docs/ops-bot/**'
      - '.github/workflows/ops-bot-ci.yml'
      # Gate C: the read-only Supabase health report the bot consumes (its SQL and Edge Function are also gated by the required web-ci job).
      - 'database/ops/0019_*'
      - 'database/public-read/tests/ops_health_report.sql'
      - 'scripts/ops-health-sql-tests.sh'
      - 'supabase/functions/azerdex-ops-health/**'
      # Option G: the HMAC-gated Data API RPC that replaces the direct database login (migrations, verifier, harness, PostgREST pin).
      - 'database/ops/002*'
      - 'database/ops/verify_ops_health_gated_rpc.sql'
      - 'scripts/ops-health-gated-rpc-tests.sh'
      - 'scripts/postgrest-pin.env'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ops-bot:
    name: Ops bot (typecheck, tests, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: ops-bot } }
    # A throwaway PostgreSQL for the Gate C end-to-end test (synthetic data, rolled-back transactions). Nothing here touches Supabase.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: local-test-password
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      OPS_HEALTH_E2E_DB: az_ops_health_sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: ops-bot/package-lock.json }
      - name: Node.js major matches the pinned version (.node-version = engines of ops-bot)
        run: |
          pinned="$(tr -d '[:space:]' < ../.node-version)"
          actual="$(node -p "process.versions.node.split('.')[0]")"
          engines="$(node -p "require('./package.json').engines.node")"
          test "$actual" = "$pinned" && test "$engines" = "${pinned}.x" || { echo "node mismatch: pinned=$pinned actual=$actual engines=$engines"; exit 1; }
      - name: Install (lockfile only, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Production dependency audit (high/critical fail)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (moderate and above fail; no exceptions exist for this package)
        run: npm audit --audit-level=moderate
      - name: TypeScript
        run: npm run typecheck
      - name: Gate C SQL on a disposable PostgreSQL (0019 projection, least-privilege role, unchanged jobs 3-7 and G2 functions, rollback)
        working-directory: .
        run: ./scripts/ops-health-sql-tests.sh
      - name: Option G gated RPC on its OWN throwaway PostgreSQL (0020 and rollback, exact effective privileges, refusal matrix, bounded key overlap, real PINNED PostgREST over HTTP, abuse and load, secret scan of all logs, 0021)
        working-directory: .
        env:
          PGPASSWORD: ''
        run: ./scripts/ops-health-gated-rpc-tests.sh
      - name: Unit, contract, integration and security tests (D1 SQL runs on SQLite via node:sqlite; Gate C end to end runs against the PostgreSQL above)
        run: npm test
      - name: No credential-shaped strings, and nothing deployable at the top level of wrangler.toml
        run: |
          ! grep -rEn 'discord(app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' src migrations wrangler.toml scripts
          ! sed '/^\[env\./,$d' wrangler.toml | grep -E 'd1_databases|crons|database_id'
