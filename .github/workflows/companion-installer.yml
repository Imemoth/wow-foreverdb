name: Build ForeverDB Installer

on:
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore companion/ForeverDB.Companion/ForeverDB.Companion.csproj -r win-x64

      - name: Build current CascLib native
        shell: pwsh
        run: ./scripts/build-current-casclib.ps1

      - name: Publish Companion
        run: >
          dotnet publish companion/ForeverDB.Companion/ForeverDB.Companion.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:BuildCommit=${{ github.sha }}
          -o artifacts/ForeverDB-Companion-0.9.11-alpha-${{ github.sha }}-win-x64

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc /DMyAppBuild="${{ github.sha }}" "installer\ForeverDB.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ForeverDB-Companion-Setup-0.9.11-alpha-${{ github.sha }}
          path: artifacts/installer/*.exe
