name: Collector smoke tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  collector-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run collector smoke tests
        run: lua5.4 tests/collector_smoke.lua

      - name: Compile addon Lua
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done < <(find addon/ForeverDB -maxdepth 1 -type f -name '*.lua' -print0 | sort -z)
          luac5.4 -p tests/collector_smoke.lua
