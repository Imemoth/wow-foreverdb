name: Collector smoke tests

on:
  pull_request:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  collector_lua:
    name: collector-smoke (Lua ${{ matrix.lua }})
    # Pin the supported runner image. Ubuntu 26.04 apt mirrors were returning
    # repeated DNS resolution failures during the prior CI run.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua ${{ matrix.lua }}
        env:
          LUA_PACKAGE: lua${{ matrix.lua }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$(mktemp)"
            if {
              sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update &&
              sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y "$LUA_PACKAGE"
            } >"$log" 2>&1; then
              cat "$log"
              rm -f "$log"
              exit 0
            else
              status=$?
            fi

            cat "$log"
            if ! grep -Eqi 'Temporary failure resolving|Could not resolve|Name or service not known|Network is unreachable|Could not connect|Connection timed out' "$log"; then
              rm -f "$log"
              exit "$status"
            fi
            rm -f "$log"
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Could not install $LUA_PACKAGE after three DNS/network attempts."
              exit "$status"
            fi
            echo "Transient package mirror DNS/network error; retrying Lua installation (attempt $((attempt + 1))/3)."
            sleep "$((attempt * 5))"
          done

      - name: Run collector smoke tests
        run: lua${{ matrix.lua }} tests/collector_smoke.lua

      - name: Run session tracker smoke tests
        run: lua${{ matrix.lua }} tests/session_tracker_smoke.lua

      - name: Run session UI smoke tests
        run: lua${{ matrix.lua }} tests/session_ui_smoke.lua

      - name: Run quest API smoke tests
        run: lua${{ matrix.lua }} tests/quest_api_smoke.lua

      - name: Run quest tracker smoke tests
        run: lua${{ matrix.lua }} tests/quest_tracker_smoke.lua

      - name: Run quest kill tracker smoke tests
        run: lua${{ matrix.lua }} tests/quest_kill_smoke.lua

      - name: Run Guildbook capture smoke test
        run: lua${{ matrix.lua }} tests/guildbook_capture_smoke.lua

      - name: Compile addon Lua
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac${{ matrix.lua }} -p "$file"
          done < <(find addon/ForeverDB -maxdepth 1 -type f -name '*.lua' -print0 | sort -z)
          luac${{ matrix.lua }} -p tests/collector_smoke.lua
          luac${{ matrix.lua }} -p tests/session_tracker_smoke.lua
          luac${{ matrix.lua }} -p tests/session_ui_smoke.lua
          luac${{ matrix.lua }} -p tests/quest_api_smoke.lua
          luac${{ matrix.lua }} -p tests/quest_tracker_smoke.lua
          luac${{ matrix.lua }} -p tests/quest_kill_smoke.lua
          luac${{ matrix.lua }} -p tests/guildbook_capture_smoke.lua

  # This exact context is required by the protected release ruleset.
  # A green check is possible only if BOTH Lua matrix jobs succeeded.
  collector-smoke:
    name: collector-smoke
    needs: [collector_lua]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Lua 5.1 and 5.4 matrix
        env:
          COLLECTOR_MATRIX_RESULT: ${{ needs.collector_lua.result }}
        shell: bash
        run: |
          if [[ "$COLLECTOR_MATRIX_RESULT" != "success" ]]; then
            echo "::error::Collector Lua matrix did not fully pass: $COLLECTOR_MATRIX_RESULT"
            exit 1
          fi
          echo "Collector Lua 5.1 and 5.4 checks passed."
