# Minimal Supabase CLI config: ONLY the welcome worker's function settings live here. Not applied by the repository; the owner deploys.
[functions.azerdex-welcome-worker]
# The caller is the database scheduler, not a Supabase user, so no user JWT exists. Authentication is the dedicated shared secret
# (x-azerdex-worker-secret, constant-time compared, fail-closed when unset). Never copy this setting to another function.
verify_jwt = false
# NOTE: no `static_files`. The CID emblem is embedded as the generated module logo-data.ts (see scripts/embed-azerdex-logo.mjs) because Supabase
# cannot ship static files with API-based deploys (dashboard / MCP / --use-api); an imported module is bundled by every deploy path.

[functions.azerdex-auth-email]
# Supabase Auth calls this Send Email hook, not a user: no user JWT exists. Authentication is the Standard Webhooks signature
# (SEND_EMAIL_HOOK_SECRET), verified before the body is parsed; fail-closed when the secret is unset. Never copy this setting to another function.
verify_jwt = false

[functions.azerdex-auth-confirm]
# Called by the public confirmation page's server route (a visitor, not a Supabase user). The credential is the one-time e-mail token
# (consumed only by this explicit POST), exactly as with Auth's own public /verify endpoint. Never copy this setting to another function.
verify_jwt = false

[functions.azerdex-news-collector]
# Invoked by the database scheduler with a dedicated shared secret.
verify_jwt = false

[functions.azerdex-ops-health]
# Called by the AzerDex Operations Bot (a Cloudflare Worker), not a Supabase user: no user JWT exists. Authentication is an HMAC-SHA256 request
# signature over timestamp + method + path (x-azerdex-ops-signature, constant-time compared, +-120 s window, fail-closed when the secret is unset).
# Read-only: it holds no database credential; it can only call the HMAC-gated RPC public.ops_health_report() through the Data API as `anon` (database/ops/0020). Never copy this setting to another function.
verify_jwt = false
